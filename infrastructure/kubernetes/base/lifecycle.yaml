apiVersion: apps/v1
kind: Deployment
metadata:
  name: lifecycle
  labels: { app.kubernetes.io/name: lifecycle, app.kubernetes.io/part-of: cvi }
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  selector: { matchLabels: { app.kubernetes.io/name: lifecycle } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: lifecycle, app.kubernetes.io/part-of: cvi }
      annotations: { prometheus.io/scrape: "true", prometheus.io/port: "9103", prometheus.io/path: /metrics }
    spec:
      serviceAccountName: cvi
      securityContext: { runAsNonRoot: true, runAsUser: 10001, seccompProfile: { type: RuntimeDefault } }
      terminationGracePeriodSeconds: 45
      topologySpreadConstraints:
        - { maxSkew: 1, topologyKey: topology.kubernetes.io/zone, whenUnsatisfiable: ScheduleAnyway, labelSelector: { matchLabels: { app.kubernetes.io/name: lifecycle } } }
      containers:
        - name: lifecycle
          image: cvi-python:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "cvi.lifecycle"]
          ports:
            - { name: http, containerPort: 9103 }
          env:
            - { name: HEALTH_PORT, value: "9103" }
          envFrom:
            - configMapRef: { name: cvi-config }
            - secretRef: { name: cvi-secrets }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "1", memory: 1Gi }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          volumeMounts: [{ name: tmp, mountPath: /tmp }, { name: data, mountPath: /data }]
          startupProbe: { httpGet: { path: /, port: http }, periodSeconds: 5, failureThreshold: 30 }
          livenessProbe: { httpGet: { path: /, port: http }, periodSeconds: 10, timeoutSeconds: 3, failureThreshold: 3 }
          readinessProbe: { httpGet: { path: /, port: http }, periodSeconds: 5, timeoutSeconds: 3, failureThreshold: 3 }
      volumes: [{ name: tmp, emptyDir: {} }, { name: data, emptyDir: {} }]
---
apiVersion: v1
kind: Service
metadata:
  name: lifecycle
  labels: { app.kubernetes.io/name: lifecycle }
spec:
  selector: { app.kubernetes.io/name: lifecycle }
  ports: [{ name: http, port: 9103, targetPort: http }]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: lifecycle }
spec:
  minAvailable: 1
  selector: { matchLabels: { app.kubernetes.io/name: lifecycle } }
