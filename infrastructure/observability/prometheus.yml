global:
  scrape_interval: 5s
  evaluation_interval: 15s

rule_files: [/etc/prometheus/alerts.yml]

scrape_configs:
  - job_name: api
    metrics_path: /metrics
    static_configs: [{ targets: ["api:8000"] }]
  - job_name: ingestion-edge
    metrics_path: /metrics
    static_configs: [{ targets: ["ingestion-edge:8001"] }]
  # one target per replica (docker compose --scale): DNS returns every container IP
  - job_name: validator
    dns_sd_configs: [{ names: ["validator"], type: A, port: 9102 }]
  - job_name: stream-processor
    dns_sd_configs: [{ names: ["stream-processor"], type: A, port: 9101 }]
  - job_name: lifecycle
    static_configs: [{ targets: ["lifecycle:9103"] }]
