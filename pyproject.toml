[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cvi"
version = "1.0.0"
description = "Connected Vehicle Intelligence platform (telemetry ingestion, streaming analytics, ML, AI agent)"
requires-python = ">=3.12"
dependencies = [
  "psycopg[binary,pool]>=3.2",
  "redis>=5.0",
  "pymongo>=4.7",
  "confluent-kafka>=2.4",
  "paho-mqtt>=2.0",
  "boto3>=1.34",
  "pyarrow>=16",
  "duckdb>=1.0",
  "numpy>=1.26",
  "pandas>=2.2",
  "scikit-learn>=1.4",
  "joblib>=1.4",
  "orjson>=3.10",
  "pyjwt>=2.8",
  "bcrypt>=4.1",
  "prometheus-client>=0.20",
  "httpx>=0.27",
  "jsonschema>=4.22",
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "opentelemetry-sdk>=1.25",
  "opentelemetry-exporter-otlp-proto-http>=1.25",
  "opentelemetry-instrumentation-fastapi>=0.46b0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8", "pytest-cov>=5", "pytest-bdd>=7", "ruff>=0.5", "mypy>=1.10",
  "mongomock>=4.1", "fakeredis[lua]>=2.23",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = [
  "integration: needs real PostgreSQL/Redis (skipped when unavailable)",
]

[tool.coverage.run]
source = ["src/cvi"]
omit = [
  "src/cvi/messaging/kafka.py",
  "src/cvi/simulator/cli.py",
  "src/cvi/*/__main__.py",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = false

# psycopg's row-factory generics make every `execute(...).fetchone()` look like a tuple to mypy although the pools are
# configured with dict_row; rather than sprinkle casts over 200 call sites these specific codes are relaxed for the
# modules that talk to PostgreSQL. Everything else (algorithms, stream, simulator, ML, messaging) is checked in full.
[[tool.mypy.overrides]]
module = ["cvi.api.*", "cvi.agent.*", "cvi.lifecycle.*", "cvi.stream.pg_sink", "cvi.storage.pg", "cvi.storage.vector", "cvi.local"]
disable_error_code = ["call-overload", "index", "arg-type", "return-value", "list-item", "union-attr", "assignment", "operator"]
